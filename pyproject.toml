[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-call-agent"
version = "0.1.0"
description = "Offline microphone and system-audio transcription with local summaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1.0",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "requests>=2.32",
  "sounddevice>=0.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
local-call-agent = "local_call_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
